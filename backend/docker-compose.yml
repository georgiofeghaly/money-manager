services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published to localhost only, for local psql/debugging during Phase 2
      # dev. Phase 4 (production) drops this — Postgres stays internal-only,
      # reachable solely from the api container.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/money_manager
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PORT: 3000
      # Origin of the `web` service below, e.g. https://app.example.com —
      # enables CORS for the browser-based web app only. Leave unset in
      # environments that don't deploy `web` at all.
      WEB_ORIGIN: ${WEB_ORIGIN:-}
    ports:
      - "3000:3000"
    networks:
      - default
      - npm-network
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Companion Flutter web app (viewer + /admin) — static build served by
  # nginx, on its own subdomain via NPM (see app/Dockerfile.web). Never
  # talks to Postgres directly; it calls the `api` service's REST/sync
  # endpoints from the browser, same as the mobile app does over Dio.
  web:
    build:
      context: ../app
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks:
      - npm-network

networks:
  # Must already exist (created once, outside this project):
  #   docker network create npm-network
  # and Nginx Proxy Manager's own compose file must also join it, so NPM
  # can reach this container as http://api:3000. No port is published to
  # the host at all — NPM is the only thing that can reach the api.
  npm-network:
    external: true

volumes:
  pgdata:
