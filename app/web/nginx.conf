# SPA fallback: go_router's client-side routes (/login, /admin, ...) only
# exist in the compiled JS, so a hard refresh or direct link to any of them
# must still resolve to index.html rather than 404ing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
